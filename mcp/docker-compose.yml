version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: mcp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mcp-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: mcp-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - mcp-network

  mcp-server:
    build: .
    container_name: mcp-server
    environment:
      - REDIS_URL=redis://redis:6379
      - ARCHIVE_ENABLED=true
      - ARCHIVE_BATCH_SIZE=200
      - ARCHIVE_FLUSH_INTERVAL=60
      - S3_DATA_BUCKET=${S3_DATA_BUCKET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-north-1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Phase 4: Rate Limiting Configuration
      - RATE_LIMIT_GLOBAL_IP=${RATE_LIMIT_GLOBAL_IP:-100/minute}
      - RATE_LIMIT_GLOBAL_KEY=${RATE_LIMIT_GLOBAL_KEY:-200/minute}
      - RATE_LIMIT_PUBLISH=${RATE_LIMIT_PUBLISH:-60/minute}
      - RATE_LIMIT_RETRIEVE=${RATE_LIMIT_RETRIEVE:-30/minute}
      - RATE_LIMIT_STATUS=${RATE_LIMIT_STATUS:-120/minute}
      - RATE_LIMIT_METRICS=${RATE_LIMIT_METRICS:-120/minute}
      - RATE_LIMIT_ADMIN=${RATE_LIMIT_ADMIN:-30/minute}
      - RATE_LIMIT_HEALTH=${RATE_LIMIT_HEALTH:-300/minute}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    networks:
      - mcp-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  mcp-network:
    driver: bridge
