services:
  - type: web
    name: core-mcp-web
    env: docker
    plan: starter
    region: oregon
    buildCommand: docker build -t registry:deploy .
    startCommand: docker run -e PORT=8080 -p 8080:8080 registry:deploy uvicorn server:app --host 0.0.0.0 --port 8080
    healthCheckPath: "/tool/get_status"
    envVars:
      - key: REDIS_URL
        fromDatabase: REDIS_URL # optional mapping if you provision Render Redis
      - key: MCP_API_KEY
        sync: false
      - key: S3_DATA_BUCKET
        sync: false
      - key: S3_KILL_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ARCHIVE_ENABLED
        value: "true"
  - type: worker
    name: core-mcp-archiver
    env: docker
    plan: starter
    region: oregon
    buildCommand: docker build -t registry:deploy .
    startCommand: docker run registry:deploy python -u -m mcp.uploader.archiver_runner
    envVars:
      - key: REDIS_URL
        sync: false
      - key: MCP_API_KEY
        sync: false
      - key: S3_DATA_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ARCHIVE_DIR
        value: "/tmp/mcp_archive"
