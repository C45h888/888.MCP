# Render Blueprint for MCP Server
# https://render.com/docs/blueprint-spec

services:
  # Main MCP Server (Web Service)
  - type: web
    name: mcp-server
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./mcp/Dockerfile
    dockerContext: ./mcp
    healthCheckPath: /health
    
    envVars:
      # Redis connection (use Render Redis or external managed Redis)
      - key: REDIS_URL
        sync: false  # Set in Render dashboard
      
      # Authentication (REQUIRED for production)
      - key: MCP_API_KEY
        generateValue: true  # Auto-generate secure key
      
      # S3 configuration for historical data retrieval
      - key: S3_DATA_BUCKET
        sync: false  # Set to your S3 bucket name
      
      - key: AWS_ACCESS_KEY_ID
        sync: false  # IAM credentials with s3:GetObject, s3:ListBucket
      
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      
      - key: AWS_REGION
        value: us-east-1
      
      # Archiver settings
      - key: ARCHIVE_FLUSH_INTERVAL
        value: "60"  # seconds
      
      - key: ARCHIVE_BATCH_SIZE
        value: "1000"
      
      - key: ARCHIVE_FORMAT
        value: jsonl  # or parquet
      
      # Metrics (optional)
      - key: ENABLE_METRICS
        value: "false"  # Set to true if using Prometheus
      
      - key: METRICS_PORT
        value: "9090"
      
      # Vector DB (optional - for RAG)
      - key: VECTOR_DB_TYPE
        value: ""  # weaviate, pinecone, faiss (leave empty to disable)
      
      - key: VECTOR_DB_URL
        sync: false
      
      - key: VECTOR_DB_API_KEY
        sync: false

