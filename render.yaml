# render.yaml (updated)
services:
  # MCP Server (Web Service)
  - type: web
    name: mcp-server
    env: docker
    # If your Dockerfile lives inside the `mcp/` directory (common), point both paths to it.
    dockerfilePath: ./mcp/Dockerfile
    dockerContext: ./mcp
    region: oregon
    # Use Standard (2 GB) for reliable pyarrow/pandas usage; change later if needed.
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: MCP_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: mcp-redis
          type: redis
          property: connectionString
      - key: PORT
        value: "8080"
      - key: MCP_DEV
        value: "false"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_DATA_BUCKET
        sync: false
      - key: S3_KILL_BUCKET
        sync: false
      - key: AWS_REGION
        value: "us-east-1"
      - key: METRICS_PORT
        value: "9090"
      - key: ARCHIVE_ENABLED
        value: "true"
      - key: ARCHIVE_FORMAT
        value: "jsonl"   # default; can be switched to 'parquet' when writer ready
      - key: ARCHIVE_DIR
        value: "/tmp/mcp_archive"
      - key: ARCHIVE_FLUSH_INTERVAL
        value: "60"
      - key: ARCHIVE_BATCH_SIZE
        value: "200"
      - key: PUBLISH_RATE_LIMIT
        value: "60/minute"
      - key: MAX_BODY_BYTES
        value: "1048576"
      - key: VECTOR_DB_TYPE
        value: ""
      - key: VECTOR_DB_URL
        value: ""
    # Service role for entrypoint.sh (web = FastAPI server)
      - key: SERVICE_ROLE
        value: "web"

  # Archiver (Background Worker)
  - type: worker
    name: mcp-archiver
    env: docker
    dockerfilePath: ./mcp/Dockerfile
    dockerContext: ./mcp
    region: oregon
    plan: standard
    # Service role for entrypoint.sh (worker = archiver background job)
    envVars:
      - key: SERVICE_ROLE
        value: "worker"
      - key: MCP_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: mcp-redis
          type: redis
          property: connectionString
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_DATA_BUCKET
        sync: false
      - key: S3_KILL_BUCKET
        sync: false
      - key: ARCHIVE_DIR
        value: "/tmp/mcp_archive"
      - key: ARCHIVE_ENABLED
        value: "true"

  # Redis (Private Service)
  - type: redis
    name: mcp-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []  # keep empty for private network within region
